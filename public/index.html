      /* é·ãæ¹ãä»£è¡¨è¡¨ç¤ºåã«æ¡ç¨ */
      if(p.length>cnt[k].rep.length) cnt[k].rep=p;
    });
  });
  personNormMap={};
  Object.keys(cnt).forEach(function(k){personNormMap[k]=cnt[k].rep;});
}
function getPersons(){
  buildPersonNormMap();
  var set = {};
  vd().forEach(function(r){
    [r[7],r[16]].forEach(function(raw){
      var p=(raw||"").trim();
      if(!p||p==="nan") return;
      var rep=personNormMap[normName(p)]||p;
      set[rep]=(set[rep]||0)+1;
    });
  });
  return Object.keys(set).sort(function(a,b){return set[b]-set[a];});
}

  var csv=rows.map(function(row){

      var s=String(v||"").replace(/"/g,'""');
      return s.indexOf(",")>=0||s.indexOf("\n")>=0||s.indexOf('"')>=0?'"'+s+'"':s;
    }).join(",");
  }).join("\n");

  /* BOMä»ãUTF-8ï¼Excelå¯¾å¿ï¼ */
  var bom="\uFEFF";
  var blob=new Blob([bom+csv],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=mk("a");a.href=url;
  a.download="\u5317\u6D77\u5DE5\u52D9\u5E97_CRM_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);if(a.click)a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("\uD83D\uDCE5 CSV\u3092\u30C0\u30A6\u30F3\u30ED\u30FC\u30C9\u3057\u307E\u3057\u305F");
}

function sortRecords(arr){
  var copy = arr.slice();
  if(curSort === "date_desc"){
    copy.sort(function(a,b){return (b[6]||"").localeCompare(a[6]||"");});
  } else if(curSort === "date_asc"){
    copy.sort(function(a,b){return (a[6]||"").localeCompare(b[6]||"");});
  } else if(curSort === "est_desc"){
    copy.sort(function(a,b){
      var ea=parseInt((a[14]||"").replace(/[^0-9]/g,"")||"0");
      var eb=parseInt((b[14]||"").replace(/[^0-9]/g,"")||"0");
      return eb-ea;
    });
  } else if(curSort === "stale_desc"){
    copy.sort(function(a,b){ return days(b[6])-days(a[6]); });
  }
  return copy;
}

var aiSummaryCache = {};

async function summarizeComment(id, commentText, targetElId){
  if(!commentText||!commentText.trim()) return;

  /* ã­ã£ãã·ã¥ç¢ºèª */
  var cacheKey = id+'_'+commentText.slice(0,20);
  if(aiSummaryCache[cacheKey]){
    var el=document.getElementById(targetElId);
    if(el) el.textContent=aiSummaryCache[cacheKey];
    return;
  }

  var el=document.getElementById(targetElId);
  if(el){
    el.textContent='\u8981\u7D04\u4E2D...';
    el.style.color='#a0aec0';
  }

  try{
    var aiKey=getAIKey();
    if(!aiKey){
      if(el){el.textContent='\u2192 \u8A2D\u5B9A\u300C\u2699\uFE0F\u300D\u304B\u3089API\u30AD\u30FC\u3092\u767B\u9332';el.style.color='#e03e3e';el.style.cursor='pointer';el.onclick=function(){openAIKeySettings();openAIKeySettings();};}
      return;
    }
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':aiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:80,
        messages:[{role:'user',content:
          '\u4EE5\u4E0B\u306E\u5EFA\u8A2D\u30FB\u30EA\u30D5\u30A9\u30FC\u30E0\u55B6\u696D\u30B3\u30E1\u30F3\u30C8\u3092\u300130\u5B57\u4EE5\u5185\u306E\u65E5\u672C\u8A9E\u3067\u8981\u70B9\u306E\u307F\u7C21\u6F54\u306B\u307E\u3068\u3081\u3066\u304F\u3060\u3055\u3044\u3002\u6848\u4EF6\u306E\u6E29\u5EA6\u611F\u3068\u6B21\u306E\u30A2\u30AF\u30B7\u30E7\u30F3\u3092\u4F18\u5148\u3057\u3066\u3002\u8FD4\u7B54\u306F\u8981\u7D04\u6587\u306E\u307F\u3001\u524D\u7F6E\u304D\u306A\u3057\u3002\n\n'+commentText
        }]
      })
    });
    var data=await res.json();
    var summary=(data.content&&data.content[0]&&data.content[0].text)||'\u8981\u7D04\u5931\u6557';
    aiSummaryCache[cacheKey]=summary;
    if(el){
      el.textContent=summary;
      el.style.color='#1a202c';
    }
  }catch(e){
    if(el){el.textContent='\u8981\u7D04\u5931\u6557';el.style.color='#c53030';}
  }
}

function undoLast(){try{
  if(editHistory.length===0) return;
  var h=editHistory.shift();
  saveHistory();

  if(h.action==="status"){
    stMap[h.id]=h.before;
    var all=vd();
    for(var i=0;i<all.length;i++){
      if(all[i][0]===h.id){all[i][5]=h.before;saveToSupabase(all[i]);break;}
    }
    if(curId===h.id) openPanel(h.id);
  } else if(h.action==="edit"){
    var all2=vd();
    for(var i=0;i<all2.length;i++){
      if(all2[i][0]!==h.id) continue;
      var fields=Object.keys(h.before);
      for(var j=0;j<fields.length;j++){
        all2[i][parseInt(fields[j])]=h.before[fields[j]];
      }
      stMap[h.id]=all2[i][5]||"new";
      saveToSupabase(all2[i]);
      break;
    }
    if(curId===h.id) openPanel(h.id);
  } else if(h.action==="del"){
    /* åé¤ãåã«æ»ã */
    D.unshift(h.before);
    if(deletedIds[h.id]) delete deletedIds[h.id];
    stMap[h.id]=h.before[5]||"new";
    saveToSupabase(h.before);
  } else if(h.action==="payment"){
    var all3=vd();
    for(var i=0;i<all3.length;i++){
      if(all3[i][0]!==h.id) continue;
      setExtra(all3[i],h.before);
      stMap[h.id]=h.beforeStatus||all3[i][5];
      all3[i][5]=stMap[h.id];
      saveToSupabase(all3[i]);
      if(curId===h.id) openPanel(h.id);
      break;
    }
  }

  saveStore();
  renderChips();renderPersonChips();render();
  updateUndoBtn();
  showToast("\u21A9 "+historyLabel(h)+"\u3092\u5143\u306B\u623B\u3057\u307E\u3057\u305F");
}catch(e){_se("undoLast",e);}}

function getDateMap(){
  var map = {};
  vd().forEach(function(r){
    var d = (r[6]||"").trim();
    if(!d || d==="nan") return;
    /* YYYY-MM-DD ã«æ­£è¦å */

}

function daysBetween(dateStr, today){
  if(!dateStr) return 999;
  try{
    var d1 = new Date(dateStr.slice(0,10));
    var d2 = new Date(today);
    return Math.floor((d2-d1) / 86400000);
  }catch(e){ return 999; }
}

/* ââ ãããã¼æå°åã­ã¸ãã¯ ââ */
(function(){
  var topBar = null;
  var listEl = null;
  var lastY   = 0;
  var collapsed = false;
  var ticking  = false;
  var collapseTimer = null;

  function initHeaderCollapse(){
    topBar = document.getElementById("top-bar");
    listEl = document.getElementById("list");
    if(!topBar || !listEl) return;

    listEl.addEventListener("scroll", onListScroll, {passive:true});

    /* ã¿ããã¹ã¯ã¤ãã§ãæ¤ç¥ */
    var startY = 0;
    listEl.addEventListener("touchstart", function(e){
      startY = e.touches[0].clientY;
    }, {passive:true});
    listEl.addEventListener("touchmove", function(e){
      var dy = startY - e.touches[0].clientY;
      if(dy > 8 && !collapsed) collapseHeader();
      if(dy < -8 && collapsed && listEl.scrollTop < 5) expandHeader();
    }, {passive:true});
  }

  function onListScroll(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var y = listEl.scrollTop;
      if(y > lastY + 6 && !collapsed){
        collapseHeader();
      } else if(y < lastY - 4 && collapsed){
        expandHeader();
      }
      if(y < 2 && collapsed){
        expandHeader();
      }
      lastY = y;
      ticking = false;
    });
  }

  window.collapseHeader = function(){
    if(!topBar) return;
    collapsed = true;
    topBar.classList.add("collapsed");
    setTimeout(fixListHeight, 320);
  };
  window.expandHeader = function(){
    if(!topBar) return;
    collapsed = false;
    topBar.classList.remove("collapsed");
    if(listEl && listEl.scrollTop < 20) listEl.scrollTo({top:0, behavior:"smooth"});
    setTimeout(fixListHeight, 320);
  };

  /* initå¾ã«ç»é² */
  window.addEventListener("load", function(){
    setTimeout(initHeaderCollapse, 200);
  });
})();

</script>

/* ââ 11. IndexedDBãªãã©ã¤ã³ã­ã£ãã·ã¥ ââ */
/* Supabaseãã¼ã¿ãã­ã¼ã«ã«ã«ä¿å­ããæ¬¡åå³è¡¨ç¤ºï¼ãªãã©ã¤ã³å¯¾å¿ */
(function(){
  var DB_NAME='crm-cache',DB_VER=1,STORE='cases';
  function openDB(cb){
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(e){e.target.result.createObjectStore(STORE);};
    req.onsuccess=function(e){cb(e.target.result);};
    req.onerror=function(){cb(null);};
  }
  function saveCache(){
    openDB(function(db){
      if(!db)return;
      var tx=db.transaction(STORE,'readwrite'),st=tx.objectStore(STORE);
      st.put(window.D||[],'records');
      st.put(window.stMap||{},'stMap');
      st.put(new Date().toISOString(),'savedAt');
    });
  }
  function loadCache(cb){
    openDB(function(db){
      if(!db){cb(null);return;}
      var tx=db.transaction(STORE,'readonly'),st=tx.objectStore(STORE);
      var recs=null,sm=null,saved=null;
      st.get('records').onsuccess=function(e){recs=e.target.result;};
      st.get('stMap').onsuccess=function(e){sm=e.target.result;};
      st.get('savedAt').onsuccess=function(e){saved=e.target.result;};
      tx.oncomplete=function(){cb(recs&&recs.length?{records:recs,stMap:sm,savedAt:saved}:null);};
      tx.onerror=function(){cb(null);};
    });
  }

  /* Supabaseèª­è¾¼å¾ã«ã­ã£ãã·ã¥ä¿å­ */
  var _origApply2=window.applyStore;
  window.applyStore=async function(){
    /* ã¾ãIndexedDBããã­ã£ãã·ã¥ãèª­è¾¼ã¿ãå³åº§ã«è¡¨ç¤º */
    await new Promise(function(resolve){
      loadCache(function(cached){
        if(cached&&cached.records&&cached.records.length>0&&(!window.D||window.D.length===0)){
          window.D=cached.records;
          if(cached.stMap){
            var ks=Object.keys(cached.stMap);
            for(var i=0;i<ks.length;i++)window.stMap[ks[i]]=cached.stMap[ks[i]];
          }
          if(typeof render==='function')render();
          if(typeof renderChips==='function')renderChips();
          if(typeof renderPersonChips==='function')renderPersonChips();
          if(typeof showToast==='function')showToast('\u26A1 \u30AD\u30E3\u30C3\u30B7\u30E5\u8868\u793A');
        }
        resolve();
      });
    });
    /* éå¸¸ã®Supabaseèª­è¾¼ */
    await _origApply2();
    /* èª­è¾¼å®äºå¾ã«ã­ã£ãã·ã¥æ´æ° */
    saveCache();
  };

  /* ãªã¢ã«ã¿ã¤ã æ´æ°æã«ãã­ã£ãã·ã¥æ´æ°ï¼ããã¦ã³ã¹ä»ãï¼ */
  var _saveTimer=null;
  var _origSub2=window.subscribeRealtime;
  window.subscribeRealtime=function(){
    _origSub2();
    /* realtimeã®ã³ã¼ã«ããã¯å¾ã«ã­ã£ãã·ã¥ä¿å­ */
    var _origRender2=window.render;
    window.render=function(){
      var r=_origRender2();
      clearTimeout(_saveTimer);
      _saveTimer=setTimeout(saveCache,3000);
      return r;
    };
  };

  /* ãªãã©ã¤ã³/ãªã³ã©ã¤ã³è¡¨ç¤º */
  window.addEventListener('online',function(){
    if(typeof showToast==='function')showToast('\u2705 \u30AA\u30F3\u30E9\u30A4\u30F3\u5FA9\u5E30');
  });
  window.addEventListener('offline',function(){

})();

(function(){
  document.addEventListener('keydown',function(e){
    /* å¥åãã£ã¼ã«ãã«ãã©ã¼ã«ã¹ä¸­ã¯ç¡è¦ */
    var tag=(e.target.tagName||'').toLowerCase();

        var pnl=document.getElementById('pnl');
        if(pnl&&pnl.classList.contains('open')){if(typeof closePanel==='function')closePanel();break;}
        var dash=document.getElementById('dashboard');
        if(dash&&dash.style.display!=='none'){dash.style.display='none';break;}
        var menu=document.getElementById('menu');
        if(menu&&menu.style.display!=='none'&&menu.style.display!==''){menu.style.display='none';break;}
        break;
      case 'd':case 'D':
        if(!e.ctrlKey&&!e.metaKey){
          e.preventDefault();
          if(typeof openDashboard==='function')openDashboard();
        }
        break;
      case 'n':case 'N':
        if(!e.ctrlKey&&!e.metaKey){
          e.preventDefault();
          var addBtn=document.getElementById('addbtn');
          if(addBtn)addBtn.click();
        }
        break;
    }
  });
})();

(function(){
  var listEl=document.getElementById('list');
  if(!listEl)return;
  var startX=0,startY=0,swiping=null,threshold=60;

  listEl.addEventListener('touchstart',function(e){
    var card=e.target.closest?e.target.closest('.card[data-rid]'):null;
    if(!card)return;
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    swiping=card;
    card.style.transition='none';
  },{passive:true});

  listEl.addEventListener('touchmove',function(e){
    if(!swiping)return;
    var dx=e.touches[0].clientX-startX;
    var dy=e.touches[0].clientY-startY;
    /* ç¸¦ã¹ã¯ã­ã¼ã«åªå */
    if(Math.abs(dy)>Math.abs(dx)){swiping.style.transform='';swiping=null;return;}
    if(Math.abs(dx)>10){
      swiping.style.transform='translateX('+dx+'px)';
      swiping.style.opacity=Math.max(0.5,1-Math.abs(dx)/300);
    }
  },{passive:true});

  listEl.addEventListener('touchend',function(e){
    if(!swiping)return;
    var card=swiping;
    swiping=null;
    var dx=e.changedTouches[0].clientX-startX;
    card.style.transition='transform 0.2s,opacity 0.2s';
    card.style.transform='';
    card.style.opacity='';

    if(Math.abs(dx)<threshold)return;
    var rid=parseInt(card.getAttribute('data-rid'));
    if(isNaN(rid))return;

    if(dx<-threshold){
      /* å·¦ã¹ã¯ã¤ã â ã¹ãã¼ã¿ã¹å¤æ´ã¯ã¤ãã¯ã¡ãã¥ã¼ */
      showSwipeMenu(rid,card);
    } else if(dx>threshold){
      /* å³ã¹ã¯ã¤ã â é»è©±çºä¿¡ */
      var d=window.D||[],r=null;
      for(var i=0;i<d.length;i++){if(d[i][0]===rid){r=d[i];break;}}
      if(r&&r[4]&&r[4]!=='\u306A\u3057'){
        window.location.href='tel:'+r[4].replace(/[-\s]/g,'');

    var pool=(ph==='sales')?SK:(ph==='won')?WK:[];

    var menu=document.createElement('div');menu.id='swipe-menu';
    menu.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #e2e8f0;padding:12px 16px 24px;z-index:200;box-shadow:0 -4px 20px rgba(0,0,0,0.15);border-radius:16px 16px 0 0';

    var title=document.createElement('div');

    title.style.cssText='font-size:13px;font-weight:700;color:#37352f';
    var closeBtn=document.createElement('button');closeBtn.type='button';
    closeBtn.textContent='\u2715';

    /* ãã³ããã­ã¹ã */

    menu.appendChild(hint);

    document.body.appendChild(menu);

    /* å¤å´ã¿ããã§éãã */
    setTimeout(function(){

/* ââ 14. ãæ°ã«å¥ã/ãã³çã ââ */
(function(){
  var PINS_KEY='crm-pins';
  function getPins(){try{return JSON.parse(localStorage.getItem(PINS_KEY)||'{}');}catch(e){return {};}}
  function savePins(p){try{localStorage.setItem(PINS_KEY,JSON.stringify(p));}catch(e){}}
  window._crmPins=getPins();

  /* sortRecordsãããã«ã©ãããã¦ãã³çããåé ­ã« */
  var _origSort2=window.sortRecords;
  window.sortRecords=function(arr){
    var sorted=_origSort2(arr);
    var pins=window._crmPins||{};
    var pinned=[],rest=[];
    for(var i=0;i<sorted.length;i++){
      if(pins[sorted[i][0]])pinned.push(sorted[i]);
      else rest.push(sorted[i]);
    }
    return pinned.concat(rest);
  };

  /* ãã³çããã°ã«é¢æ° */
  window.togglePin=function(rid){
    var pins=window._crmPins||{};
    if(pins[rid])delete pins[rid];
    else pins[rid]=true;
    window._crmPins=pins;
    savePins(pins);
    if(typeof render==='function')render();
    if(typeof showToast==='function'){
      showToast(pins[rid]?'\uD83D\uDCCC \u30D4\u30F3\u7559\u3081\u3057\u307E\u3057\u305F':'\u30D4\u30F3\u7559\u3081\u89E3\u9664');
    }
  };

  /* ã«ã¼ãã«ãã³ããã¸ãè¿½å  â cardHTMLçæå¾ã«DOMæä½ */
  var _origRender3=window.render;
  window.render=function(){
    var r=_origRender3();
    /* ãã³çãã«ã¼ãã«ããã¸è¿½å  */
    requestAnimationFrame(function(){
      var pins=window._crmPins||{};
      var cards=document.querySelectorAll('.card[data-rid]');
      for(var i=0;i<cards.length;i++){
        var rid=parseInt(cards[i].getAttribute('data-rid'));
        if(pins[rid]){
          var existing=cards[i].querySelector('.pin-badge');
          if(!existing){
            var badge=document.createElement('span');
            badge.className='pin-badge';
            badge.textContent='\uD83D\uDCCC';
            badge.style.cssText='position:absolute;top:4px;right:6px;font-size:12px;z-index:2';
            cards[i].style.position='relative';
            cards[i].appendChild(badge);
          }
        }
      }
    });
    return r;
  };

  /* è©³ç´°ããã«ã«ãã³çããã¿ã³ãè¿½å  */
  var _origPanel=window.openPanel;
  window.openPanel=function(id){
    _origPanel(id);
    setTimeout(function(){
      var pnlbdg=document.getElementById('pnlbdg');
      if(!pnlbdg)return;
      var oldPin=document.getElementById('pin-btn');
      if(oldPin)oldPin.remove();
      var pins=window._crmPins||{};
      var btn=document.createElement('button');btn.type='button';btn.id='pin-btn';
      btn.textContent=pins[id]?'\uD83D\uDCCC \u30D4\u30F3\u89E3\u9664':'\uD83D\uDCCC \u30D4\u30F3\u7559\u3081';
      btn.style.cssText='margin-top:8px;padding:6px 12px;border:1.5px solid #e9e9e7;border-radius:8px;background:'+(pins[id]?'#fff7ed':'#fff')+';color:#37352f;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit';
      btn.onclick=function(){togglePin(id);closePanel();};
      pnlbdg.appendChild(btn);
    },50);
  };
})();

})();
